<title>SpiderWave — Your sales team in Japan</title>

<meta name="theme-color" content="#07080d">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SpiderWave">
<meta property="og:title" content="SpiderWave — Your sales team in Japan">
<meta property="og:description" content="Selling in Japan is nothing like selling anywhere else. 334 qualified meetings and 78+ closed deals in five weeks.">

<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080d;
  --panel:#11141f;
  --line:rgba(255,255,255,.08);
  --text:#eef0f6;
  --muted:#9aa1b5;
  --accent:#4f7cff;
  --accent3:#37d5c1;
  --grad:linear-gradient(120deg,#4f7cff,#8a5cff 55%,#37d5c1);
  --ff:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --tracking:-.01em;
}
html[lang="ja"]{--ff:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;--tracking:.01em}
html[lang^="zh"]{--ff:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;--tracking:.01em}
html[lang="ko"]{--ff:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--tracking:-.005em}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--ff);line-height:1.8;overflow-x:hidden;
  letter-spacing:var(--tracking);
}
::selection{background:rgba(79,124,255,.4)}

.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.22;z-index:0;pointer-events:none;animation:drift 22s ease-in-out infinite alternate}
.orb1{width:520px;height:520px;background:#3b5bff;top:-140px;left:-120px}
.orb2{width:460px;height:460px;background:#7b3bff;top:40vh;right:-160px;animation-delay:-8s}
.orb3{width:380px;height:380px;background:#0fbfae;bottom:-120px;left:30vw;animation-delay:-15s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,40px) scale(1.15)}}

nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 6vw;background:rgba(7,8,13,.55);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);gap:16px;
}
.logo{font-family:'Outfit',sans-serif;font-weight:800;font-size:1.35rem;letter-spacing:.02em;flex-shrink:0}
.logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-right{display:flex;gap:28px;align-items:center}
.nav-right a.nlink{color:var(--muted);text-decoration:none;font-size:.9rem;transition:color .3s;white-space:nowrap}
.nav-right a.nlink:hover{color:#fff}
.btn{
  display:inline-block;background:var(--grad);background-size:200% 200%;
  color:#fff;text-decoration:none;padding:13px 34px;border-radius:999px;
  font-weight:700;font-size:.95rem;letter-spacing:.02em;white-space:nowrap;
  transition:transform .3s,box-shadow .3s;animation:gradShift 6s ease infinite;
  box-shadow:0 8px 30px rgba(79,124,255,.35);
}
.btn:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 14px 44px rgba(122,92,255,.5)}
.btn.small{padding:10px 24px;font-size:.85rem}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.lang{position:relative;flex-shrink:0}
.lang-btn{
  display:flex;align-items:center;gap:8px;cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  color:var(--text);font-family:inherit;font-size:.85rem;
  padding:9px 14px;border-radius:999px;transition:border-color .3s,background .3s;
}
.lang-btn:hover{border-color:rgba(79,124,255,.5);background:rgba(79,124,255,.1)}
.lang-btn svg{width:15px;height:15px;stroke:var(--accent3);flex-shrink:0}
.lang-btn .chev{width:9px;height:9px;stroke:var(--muted);transition:transform .3s}
.lang.open .lang-btn .chev{transform:rotate(180deg)}
.lang-menu{
  position:absolute;top:calc(100% + 10px);right:0;min-width:160px;
  background:#0d1019;border:1px solid var(--line);border-radius:14px;
  padding:6px;box-shadow:0 20px 50px rgba(0,0,0,.6);
  opacity:0;visibility:hidden;transform:translateY(-8px);
  transition:opacity .25s,transform .25s,visibility .25s;z-index:200;
}
.lang.open .lang-menu{opacity:1;visibility:visible;transform:none}
.lang-menu button{
  display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;
  background:none;border:none;color:var(--muted);cursor:pointer;
  font-family:'Outfit','Noto Sans JP','Noto Sans SC','Noto Sans KR',sans-serif;
  font-size:.88rem;text-align:left;padding:10px 12px;border-radius:9px;transition:background .2s,color .2s;
}
.lang-menu button:hover{background:rgba(255,255,255,.06);color:#fff}
.lang-menu button.active{color:var(--accent3)}
.lang-menu button .tick{opacity:0;font-size:.8rem}
.lang-menu button.active .tick{opacity:1}

.hero{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:140px 6vw 90px}
.hero .eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--accent3);font-size:.82rem;letter-spacing:.2em;font-weight:500;margin-bottom:26px}
.hero .eyebrow::before{content:"";width:34px;height:1px;background:var(--accent3);flex-shrink:0}
.hero h1{font-size:clamp(2rem,5.2vw,4.1rem);font-weight:900;line-height:1.35}
html[lang="en"] .hero h1,html[lang="es"] .hero h1{line-height:1.18;letter-spacing:-.025em}
html[lang="ko"] .hero h1{line-height:1.3}
.hero h1 .grad{background:var(--grad);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradShift 6s ease infinite}
.hero p.lead{margin-top:30px;max-width:660px;color:var(--muted);font-size:clamp(.98rem,1.4vw,1.1rem)}
.hero .cta-row{margin-top:44px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.link-ghost{color:var(--text);text-decoration:none;font-size:.95rem;border-bottom:1px solid var(--line);padding-bottom:2px;transition:border-color .3s}
.link-ghost:hover{border-color:var(--accent)}
.scroll-hint{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:.7rem;letter-spacing:.3em;writing-mode:vertical-rl;opacity:.7}
.scroll-hint::after{content:"";display:block;width:1px;height:46px;margin:12px auto 0;background:linear-gradient(var(--muted),transparent);animation:scrollLine 2s ease infinite}
@keyframes scrollLine{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

section{position:relative;z-index:1;padding:110px 6vw}
.section-label{color:var(--accent);font-weight:600;letter-spacing:.22em;font-size:.78rem;text-transform:uppercase;margin-bottom:16px}
h2{font-size:clamp(1.55rem,3.3vw,2.4rem);font-weight:900;line-height:1.5;margin-bottom:22px}
html[lang="en"] h2,html[lang="es"] h2{line-height:1.25;letter-spacing:-.02em}
.section-lead{color:var(--muted);max-width:720px;margin-bottom:56px}

.stats{background:linear-gradient(180deg,transparent,rgba(79,124,255,.05),transparent)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:38px 26px;text-align:center;position:relative;overflow:hidden;transition:transform .4s,border-color .4s}
.stat:hover{transform:translateY(-6px);border-color:rgba(79,124,255,.45)}
.stat::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% -20%,rgba(79,124,255,.16),transparent 65%)}
.stat .num{font-family:'Outfit',sans-serif;font-weight:800;font-size:clamp(2.4rem,4.5vw,3.4rem);line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;position:relative}
.stat .unit{font-size:1.05rem;font-weight:700;margin-left:3px;font-family:var(--ff)}
html[lang="en"] .stat .unit,html[lang="es"] .stat .unit{font-size:inherit;margin-left:0}
.stat .label{margin-top:10px;color:var(--muted);font-size:.87rem;position:relative;line-height:1.6}
.stat .note{margin-top:4px;color:var(--accent3);font-size:.74rem;letter-spacing:.04em;position:relative}

.gap-wrap{position:relative}
.gap-cards{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.gap-card{border-radius:22px;padding:44px 36px;border:1px solid var(--line);position:relative;overflow:hidden}
.gap-card.overseas{background:var(--panel)}
.gap-card.japan{background:linear-gradient(160deg,rgba(79,124,255,.12),rgba(138,92,255,.08));border-color:rgba(79,124,255,.35)}
.gap-card h3{font-size:1.2rem;font-weight:900;margin-bottom:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;line-height:1.4}
.gap-card .tag{font-size:.65rem;letter-spacing:.16em;padding:5px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-weight:500}
.gap-card.japan .tag{border-color:rgba(79,124,255,.5);color:var(--accent)}
.gap-card ul{list-style:none;margin-top:22px}
.gap-card li{padding:14px 0;border-bottom:1px dashed var(--line);color:var(--muted);font-size:.93rem;display:flex;gap:12px;align-items:flex-start;line-height:1.7}
.gap-card li:last-child{border-bottom:none}
.gap-card li::before{content:"—";color:var(--accent);flex-shrink:0}
.gap-card.japan li{color:#cdd3e4}
.vs-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-weight:800;color:var(--accent);z-index:2;box-shadow:0 0 40px rgba(79,124,255,.35)}

.why-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:24px}
.why-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:38px 32px;transition:transform .4s,border-color .4s}
.why-card:hover{transform:translateY(-6px);border-color:rgba(138,92,255,.45)}
.why-card .idx{font-family:'Outfit',sans-serif;font-weight:800;font-size:.82rem;color:var(--accent);letter-spacing:.14em;margin-bottom:16px}
.why-card h3{font-size:1.1rem;font-weight:700;margin-bottom:12px;line-height:1.6}
.why-card p{color:var(--muted);font-size:.9rem}

.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:22px;counter-reset:step}
.flow-step{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:36px 30px;transition:transform .4s,border-color .4s}
.flow-step:hover{transform:translateY(-6px);border-color:rgba(55,213,193,.45)}
.flow-step::before{counter-increment:step;content:"0" counter(step);font-family:'Outfit',sans-serif;font-weight:800;font-size:2.2rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:block;margin-bottom:14px}
.flow-step h3{font-size:1.03rem;font-weight:700;margin-bottom:10px;line-height:1.5}
.flow-step p{color:var(--muted);font-size:.88rem}

.cta-section{padding:130px 6vw;text-align:center}
.cta-inner{max-width:880px;margin:0 auto;position:relative;background:linear-gradient(160deg,rgba(79,124,255,.14),rgba(138,92,255,.1),rgba(55,213,193,.08));border:1px solid rgba(79,124,255,.3);border-radius:30px;padding:78px 7vw;overflow:hidden}
.cta-inner::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(138,92,255,.25),transparent 60%)}
.cta-inner h2{position:relative}
.cta-inner p{position:relative;color:var(--muted);max-width:600px;margin:0 auto 40px}
.cta-inner .btn{position:relative;font-size:1.05rem;padding:18px 52px}
.cta-mail{margin-top:22px;position:relative;color:var(--muted);font-size:.85rem}
.cta-mail a{color:var(--accent3);text-decoration:none}

footer{border-top:1px solid var(--line);padding:46px 6vw;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;position:relative;z-index:1}
footer .copy{color:var(--muted);font-size:.8rem}

.reveal{opacity:0;transform:translateY(36px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.reveal.visible{opacity:1;transform:none}
.reveal.d1{transition-delay:.12s}.reveal.d2{transition-delay:.24s}.reveal.d3{transition-delay:.36s}
.swap{animation:swapIn .45s ease}
@keyframes swapIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media(max-width:900px){
  .nav-right a.nlink{display:none}
  .gap-cards{grid-template-columns:1fr}
  .vs-badge{display:none}
  section{padding:80px 6vw}
  .hero{padding:130px 6vw 80px}
}
@media(max-width:520px){
  .nav-right .btn.small{display:none}
  .cta-inner{padding:60px 8vw}
}
</style>
</head>
<body>

<div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>

  <div class="section-label reveal" data-i18n="svcLabel"></div>

const LANGS = [
  {code:"en", htmlLang:"en",      label:"English"},
  {code:"ja", htmlLang:"ja",      label:"日本語"},

en:{

let current = null;

// English is always the default view. A visitor can switch languages from the
// nav, or be sent straight to one with ?lang=ja / es / zh / ko in the URL.
function pickInitialLang(){
  const p = new URLSearchParams(location.search).get("lang");
  if(p && I18N[p]) return p;
  return "en";
}

function buildMailto(t){
  return "mailto:" + MAIL +
    "?subject=" + encodeURIComponent(t.mailSubject) +
    "&body=" + encodeURIComponent(t.mailBody);
}

function applyLang(code, animate){
  const t = I18N[code];
  if(!t) return;
  current = code;
  const meta = LANGS.find(l => l.code === code);
  document.documentElement.lang = meta.htmlLang;
  document.title = t.title;
  document.getElementById("metaDesc").setAttribute("content", t.desc);

  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const v = t[el.dataset.i18n];
    if(v !== undefined) el.textContent = v;
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{
    const v = t[el.dataset.i18nHtml];
    if(v !== undefined) el.innerHTML = v;
  });

  const href = buildMailto(t);
  document.querySelectorAll(".mail-cta").forEach(a => a.setAttribute("href", href));

  document.getElementById("langLabel").textContent = meta.label;
  document.querySelectorAll("#langMenu button").forEach(b=>{
    b.classList.toggle("active", b.dataset.code === code);
  });

  if(animate){
    document.querySelectorAll("h1,h2,.section-lead,.hero p.lead,.gap-card,.why-card,.flow-step,.stat")
      .forEach(el=>{
        el.classList.remove("swap");
        void el.offsetWidth;
        el.classList.add("swap");
      });
  }

  try{
    const url = new URL(location.href);
    url.searchParams.set("lang", code);
    history.replaceState(null, "", url);
  }catch(e){}
}

const menu = document.getElementById("langMenu");
LANGS.forEach(l=>{
  const b = document.createElement("button");
  b.dataset.code = l.code;
  b.innerHTML = "<span>" + l.label + "</span><span class='tick'>✓</span>";
  b.addEventListener("click", ()=>{
    applyLang(l.code, true);
    document.getElementById("lang").classList.remove("open");
  });
  menu.appendChild(b);
});

const langWrap = document.getElementById("lang");
document.getElementById("langBtn").addEventListener("click", e=>{
  e.stopPropagation();
  langWrap.classList.toggle("open");
  document.getElementById("langBtn").setAttribute("aria-expanded", langWrap.classList.contains("open"));
});
document.addEventListener("click", ()=> langWrap.classList.remove("open"));
document.addEventListener("keydown", e=>{ if(e.key === "Escape") langWrap.classList.remove("open"); });

applyLang(pickInitialLang(), false);

const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add("visible"); io.unobserve(e.target); }
  });
},{threshold:.15});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));

const counterIO = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(!e.isIntersecting) return;
    const el = e.target;
    counterIO.unobserve(el);
    const target = +el.dataset.target, dur = 1600, start = performance.now();
    const tick = now=>{
      const p = Math.min((now - start)/dur, 1);
      el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))).toLocaleString();
      if(p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
},{threshold:.6});
document.querySelectorAll(".count").forEach(el=>counterIO.observe(el));
</script>
